<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stride Mechanica</title>
<meta name="description" content="Multi-Legged Machine Design & Simulation. Design · Simulate · Build">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg stroke='%23e8a33d' stroke-width='3' stroke-linecap='round' fill='none'%3E%3Cpath d='M16 12 L6 6 L3 14 M16 12 L26 6 L29 14 M16 16 L5 17 L3 26 M16 16 L27 17 L29 26 M16 20 L8 26 M16 20 L24 26'/%3E%3C/g%3E%3Cellipse cx='16' cy='16' rx='5' ry='8' fill='%23e8a33d'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0e1116;
    --panel: #151a21;
    --panel-2: #1b212a;
    --line: #2a323d;
    --text: #d8dee6;
    --muted: #8a95a3;
    --accent: #e8a33d;
    --accent-soft: rgba(232, 163, 61, 0.14);
    --error: #ff7b72;
    --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 var(--sans);
    display: grid;
    grid-template-rows: auto 1fr;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    min-width: 0;
  }
  .brand { display: flex; align-items: baseline; gap: 14px; min-width: 0; flex-wrap: wrap; }
  .brand h1 {
    margin: 0;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.18em;
    white-space: nowrap;
  }
  .brand h1 span { color: var(--accent); }
  .brand p { margin: 0; color: var(--muted); font-size: 13px; white-space: nowrap; }
  .actions { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  button, .link {
    font: 13px var(--sans);
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 5px 10px;
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
  }
  button:hover, .link:hover { border-color: var(--accent); }
  button:disabled { opacity: 0.45; cursor: default; border-color: var(--line); }
  button.stop { color: var(--accent); }

  main {
    display: grid;
    grid-template-columns: 2fr 1fr;
    min-height: 0;
  }
  .views { position: relative; background: #000; min-height: 0; }
  .views iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: #000;
    color: var(--muted);
    text-align: center;
    padding: 16px;
  }
  .overlay strong { color: var(--text); font-size: 15px; font-weight: 600; }
  .overlay .bar { width: min(260px, 70%); height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .overlay .bar div { height: 100%; width: 0; background: var(--accent); transition: width 0.2s; }
  .overlay.failed strong { color: var(--error); }
  .overlay[hidden] { display: none; }

  .console {
    display: grid;
    grid-template-rows: auto 1fr auto;
    min-height: 0;
    min-width: 0;
    border-left: 1px solid var(--line);
    background: var(--panel);
  }
  .console-head {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 14px;
    border-bottom: 1px solid var(--line);
    font-size: 12px;
    color: var(--muted);
  }
  .console-head b { color: var(--text); font-weight: 600; letter-spacing: 0.06em; }
  #status { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #output {
    margin: 0;
    padding: 10px 14px;
    overflow: auto;
    font: 12.5px/1.45 var(--mono);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    tab-size: 4;
    min-height: 0;
  }
  #output .cmd { color: var(--accent); }
  #output .note { color: var(--muted); }
  form {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-top: 1px solid var(--line);
    background: var(--panel-2);
  }
  form label { color: var(--accent); font: 14px var(--mono); }
  #command {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: 0;
    outline: none;
    color: var(--text);
    font: 14px var(--mono);
  }
  #command::placeholder { color: var(--muted); }

  @media (max-width: 820px) {
    body { overflow: auto; grid-template-rows: auto auto; height: auto; }
    header { flex-wrap: wrap; }
    .brand p.catch { display: none; }
    .actions { margin-left: 0; justify-content: flex-start; }
    main { grid-template-columns: 1fr; grid-template-rows: min(100vw, 70vh) 55vh; }
    .console { border-left: 0; border-top: 1px solid var(--line); }
    /* Phones zoom in on text fields with smaller text */
    #command { font-size: 16px; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>STRIDE <span>MECHANICA</span></h1>
    <p>Multi-Legged Machine Design &amp; Simulation</p>
    <p class="catch">Design · Simulate · Build</p>
  </div>
  <nav class="actions" aria-label="Demos">
    <button data-commands="reset 2|run demo" title="reset 2, run demo">Hexapod demo</button>
    <button data-commands="reset 8|walk 0 40 10" title="reset 8, walk 0 40 10">Insect</button>
    <button data-commands="reset 9|run centipede" title="reset 9, run centipede">Centipede demo</button>
    <button class="stop" data-commands="halt" title="halt">Stop</button>
    <button data-commands="help" title="help">Help</button>
    <a class="link" href="https://github.com/hansj66/stride-mechanica" target="_blank" rel="noopener">GitHub</a>
  </nav>
</header>
<main>
  <section class="views" aria-label="Simulator views">
    <iframe id="views" src="game.html" title="Simulator views"></iframe>
    <div class="overlay" id="overlay">
      <strong id="overlay-title">Loading the simulator</strong>
      <div class="bar"><div id="bar"></div></div>
      <span id="overlay-text">Starting…</span>
    </div>
  </section>
  <section class="console" aria-label="Shell">
    <div class="console-head"><b>SHELL</b><span id="status"></span></div>
    <pre id="output" aria-live="polite"></pre>
    <form id="form" autocomplete="off">
      <label for="command">›</label>
      <input id="command" type="text" autocapitalize="none" autocorrect="off" autocomplete="off" spellcheck="false"
             enterkeyhint="send" placeholder="Loading…" disabled>
    </form>
  </section>
</main>
<script>
  // The page around the views: the shell's console (see simulator/console_js.go), and buttons for the demos
  const output = document.getElementById("output");
  const input = document.getElementById("command");
  const frame = document.getElementById("views");
  const overlay = document.getElementById("overlay");
  const buttons = document.querySelectorAll("[data-commands]");
  const MAX_LINES = 4000;
  const history = [];
  let historyAt = 0;
  let isReady = false;

  function append(text, kind) {
    const atBottom = output.scrollHeight - output.scrollTop - output.clientHeight < 40;
    const line = document.createElement("div");
    if (kind) line.className = kind;
    line.textContent = text === "" ? " " : text;
    output.appendChild(line);
    while (output.childElementCount > MAX_LINES) output.firstChild.remove();
    if (atBottom) output.scrollTop = output.scrollHeight;
  }

  function send(command) {
    if (!isReady) return;
    append("› " + command, "cmd");
    output.scrollTop = output.scrollHeight;
    frame.contentWindow.mechanicaCommand(command);
  }

  // Called by the simulator (in the frame)
  window.mechanicaConsole = {
    print: line => append(line),
    status: text => { document.getElementById("status").textContent = text; },
    ready: () => {
      isReady = true;
      overlay.hidden = true;
      input.disabled = false;
      input.placeholder = "Type a command, e.g. walk 0 50 10";
      buttons.forEach(b => b.disabled = false);
      append("Pods you save stay in this browser. export_cad downloads the CAD assembly description.", "note");
      append("A gamepad connects when you press one of its buttons.", "note");
      input.focus();
      // Commands in the address: ?run=reset 9;run centipede
      const run = new URLSearchParams(location.search).get("run");
      if (run) run.split(";").map(c => c.trim()).filter(Boolean).forEach(send);
    },
    loading: bytes => {
      const mb = bytes / 1e6;
      document.getElementById("overlay-text").textContent = `${mb.toFixed(1)} MB`;
      // The download is about 19 MB uncompressed
      document.getElementById("bar").style.width = Math.min(100, mb / 19 * 100) + "%";
    },
    failed: message => {
      overlay.hidden = false;
      overlay.classList.add("failed");
      document.getElementById("overlay-title").textContent = "The simulator didn't start";
      document.getElementById("overlay-text").textContent = message;
    },
    download: (name, text) => {
      const url = URL.createObjectURL(new Blob([text], { type: "application/json" }));
      const a = document.createElement("a");
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    },
  };

  buttons.forEach(b => {
    b.disabled = true;
    b.addEventListener("click", () => {
      b.dataset.commands.split("|").forEach(send);
      input.focus();
    });
  });

  document.getElementById("form").addEventListener("submit", e => {
    e.preventDefault();
    const command = input.value.trim();
    if (!command) return;
    if (history[history.length - 1] !== command) history.push(command);
    historyAt = history.length;
    input.value = "";
    send(command);
  });

  input.addEventListener("keydown", e => {
    if (e.key === "ArrowUp" && historyAt > 0) {
      input.value = history[--historyAt];
    } else if (e.key === "ArrowDown" && historyAt < history.length) {
      historyAt++;
      input.value = historyAt < history.length ? history[historyAt] : "";
    } else {
      return;
    }
    e.preventDefault();
    input.setSelectionRange(input.value.length, input.value.length);
  });

  // A click in the console (not a text selection) goes back to the command line
  output.addEventListener("mouseup", () => {
    if (!window.getSelection().toString() && !input.disabled) input.focus();
  });
</script>
</body>
</html>
